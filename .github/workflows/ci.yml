name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Check if release exists
        id: check
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $release = gh release view "${{ github.ref_name }}" --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            echo "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "exists=false" >> $env:GITHUB_OUTPUT
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: steps.check.outputs.exists == 'true'
        run: >
          dotnet publish src/DevHub.Presentation/DevHub.Presentation.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Zip
        if: steps.check.outputs.exists == 'true'
        run: Compress-Archive -Path publish/* -DestinationPath DevHub-${{ github.ref_name }}-win-x64.zip

      - name: Upload to release
        if: steps.check.outputs.exists == 'true'
        shell: pwsh
        run: |
          gh release upload "${{ github.ref_name }}" "DevHub-${{ github.ref_name }}-win-x64.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
