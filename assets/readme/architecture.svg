<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="280" viewBox="0 0 1200 280"
     role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">DevHub Clean Architecture</title>
  <desc id="arch-desc">Four concentric layers showing the Clean Architecture: Domain at the center, Application, Infrastructure, and Presentation on the outside.</desc>

  <rect width="1200" height="280" rx="16" fill="#09090B"/>

  <!-- Section title -->
  <text x="64" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="24" font-weight="600" fill="#FAFAFA">Architecture</text>
  <text x="218" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="16" font-weight="400" fill="#71717A">— Clean Architecture with strict layer separation</text>

  <!-- Concentric architecture layers -->
  <g transform="translate(520 155)">

    <!-- Presentation (outermost) -->
    <rect x="-248" y="-108" width="496" height="216" rx="20" fill="none"
          stroke="#8B5CF6" stroke-width="2" stroke-dasharray="6 3" opacity="0.6"/>
    <text x="-238" y="-88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="600" fill="#8B5CF6">PRESENTATION</text>

    <!-- Infrastructure -->
    <rect x="-194" y="-78" width="388" height="156" rx="16" fill="none"
          stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 3" opacity="0.6"/>
    <text x="-184" y="-58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="600" fill="#F59E0B">INFRASTRUCTURE</text>

    <!-- Application -->
    <rect x="-140" y="-48" width="280" height="96" rx="12" fill="none"
          stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 3" opacity="0.6"/>
    <text x="-130" y="-28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="600" fill="#3B82F6">APPLICATION</text>

    <!-- Domain (center) -->
    <rect x="-86" y="-18" width="172" height="56" rx="10" fill="#19A337" opacity="0.15"
          stroke="#19A337" stroke-width="2"/>
    <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" font-weight="700" fill="#19A337" text-anchor="middle">DOMAIN</text>

  </g>

  <!-- Dependency arrows (right side) -->
  <g transform="translate(810 90)">
    <!-- Arrow 1: Domain -> Application -->
    <line x1="0" y1="0" x2="0" y2="50" stroke="#3F3F46" stroke-width="1.5"/>
    <polygon points="-4,46 4,46 0,54" fill="#3F3F46"/>

    <!-- Arrow 2: Application -> Infrastructure -->
    <line x1="0" y1="64" x2="0" y2="114" stroke="#3F3F46" stroke-width="1.5"/>
    <polygon points="-4,110 4,110 0,118" fill="#3F3F46"/>

    <!-- Arrow 3: Infrastructure -> Presentation -->
    <line x1="0" y1="128" x2="0" y2="178" stroke="#3F3F46" stroke-width="1.5"/>
    <polygon points="-4,174 4,174 0,182" fill="#3F3F46"/>
  </g>

  <!-- Side labels -->
  <g transform="translate(880 90)">
    <rect x="0" y="0" width="220" height="36" rx="8" fill="#18181B" stroke="#3F3F46" stroke-width="1"/>
    <text x="110" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13" fill="#A1A1AA" text-anchor="middle">Inner layers know nothing</text>

    <rect x="0" y="54" width="220" height="36" rx="8" fill="#18181B" stroke="#3F3F46" stroke-width="1"/>
    <text x="110" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13" fill="#A1A1AA" text-anchor="middle">about outer layers</text>

    <rect x="0" y="128" width="220" height="36" rx="8" fill="#18181B" stroke="#3F3F46" stroke-width="1"/>
    <text x="110" y="151" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13" fill="#A1A1AA" text-anchor="middle">Dependency Rule enforced</text>
  </g>

</svg>
