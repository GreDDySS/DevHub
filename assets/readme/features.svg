<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="200" viewBox="0 0 1200 200"
     role="img" aria-labelledby="feat-title feat-desc">
  <title id="feat-title">DevHub Features</title>
  <desc id="feat-desc">Six feature cards showing: Project Management, Link Capture, IDE Detection, Auto-Detect, Theme, and System Tray.</desc>

  <rect width="1200" height="200" rx="16" fill="#09090B"/>

  <!-- Feature 1: Project Management -->
  <g transform="translate(40 30)">
    <rect width="170" height="140" rx="12" fill="#18181B" stroke="#3F3F46" stroke-width="1"/>
    <!-- Folder icon -->
    <g transform="translate(24 24)">
      <path d="M0,2 L18,2 L22,8 L0,8 Z" fill="#19A337" opacity="0.8"/>
      <rect x="0" y="6" width="28" height="20" rx="3" fill="#19A337" opacity="0.6"/>
    </g>
    <text x="24" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="600" fill="#FAFAFA">Projects</text>
    <text x="24" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#71717A">Catalog, status,</text>
    <text x="24" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#71717A">favorites, tags</text>
    <text x="24" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#71717A">quick launch</text>
  </g>

  <!-- Feature 2: Link Capture -->
  <g transform="translate(226 30)">
    <rect width="170" height="140" rx="12" fill="#18181B" stroke="#3F3F46" stroke-width="1"/>
    <!-- Chain link icon -->
    <g transform="translate(24 22)">
      <rect x="0" y="4" width="24" height="16" rx="8" fill="none" stroke="#60A5FA" stroke-width="2.5"/>
      <rect x="14" y="4" width="24" height="16" rx="8" fill="none" stroke="#60A5FA" stroke-width="2.5"/>
    </g>
    <text x="24" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="600" fill="#FAFAFA">Links</text>
    <text x="24" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#71717A">Ctrl+Shift+Y to</text>
    <text x="24" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#71717A">capture URLs,</text>
    <text x="24" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#71717A">auto-detect type</text>
  </g>

  <!-- Feature 3: IDE Detection -->
  <g transform="translate(412 30)">
    <rect width="170" height="140" rx="12" fill="#18181B" stroke="#3F3F46" stroke-width="1"/>
    <!-- Terminal icon -->
    <g transform="translate(24 22)">
      <rect x="0" y="0" width="28" height="22" rx="4" fill="none" stroke="#A78BFA" stroke-width="2"/>
      <polyline points="4,8 10,14 4,20" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="13" y1="20" x2="22" y2="20" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="24" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="600" fill="#FAFAFA">IDEs</text>
    <text x="24" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#71717A">Auto-detect 10</text>
    <text x="24" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#71717A">editors, set</text>
    <text x="24" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#71717A">preferred per project</text>
  </g>

  <!-- Feature 4: Auto-Detect Projects -->
  <g transform="translate(598 30)">
    <rect width="170" height="140" rx="12" fill="#18181B" stroke="#3F3F46" stroke-width="1"/>
    <!-- Scan/search icon -->
    <g transform="translate(24 22)">
      <circle cx="10" cy="10" r="8" fill="none" stroke="#34D399" stroke-width="2"/>
      <line x1="16" y1="16" x2="24" y2="24" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="24" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="600" fill="#FAFAFA">Auto-Detect</text>
    <text x="24" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#71717A">Scan filesystem</text>
    <text x="24" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#71717A">for projects by</text>
    <text x="24" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#71717A">language detection</text>
  </g>

  <!-- Feature 5: Dark/Light Theme -->
  <g transform="translate(784 30)">
    <rect width="170" height="140" rx="12" fill="#18181B" stroke="#3F3F46" stroke-width="1"/>
    <!-- Moon icon -->
    <g transform="translate(24 22)">
      <path d="M14,2 A10,10 0 1,0 22,18 A8,8 0 1,1 14,2 Z" fill="#FBBF24"/>
    </g>
    <text x="24" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="600" fill="#FAFAFA">Theme</text>
    <text x="24" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#71717A">Dark and light</text>
    <text x="24" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#71717A">mode toggle,</text>
    <text x="24" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#71717A">persisted in settings</text>
  </g>

  <!-- Feature 6: System Tray -->
  <g transform="translate(970 30)">
    <rect width="170" height="140" rx="12" fill="#18181B" stroke="#3F3F46" stroke-width="1"/>
    <!-- Tray icon (simplified monitor) -->
    <g transform="translate(24 22)">
      <rect x="2" y="0" width="22" height="16" rx="3" fill="none" stroke="#F87171" stroke-width="2"/>
      <line x1="8" y1="20" x2="18" y2="20" stroke="#F87171" stroke-width="2" stroke-linecap="round"/>
      <line x1="13" y1="16" x2="13" y2="20" stroke="#F87171" stroke-width="2"/>
    </g>
    <text x="24" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="600" fill="#FAFAFA">Tray</text>
    <text x="24" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#71717A">Minimize to tray,</text>
    <text x="24" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#71717A">autostart with</text>
    <text x="24" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#71717A">Windows, notifications</text>
  </g>

</svg>
